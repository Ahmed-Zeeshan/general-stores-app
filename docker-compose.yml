# Local MongoDB for Dukaan Manager.
#   Start:  docker compose up -d
#   Stop:   docker compose down        (data is kept in the "mongo-data" volume)
services:
  mongo:
    image: mongo:7
    container_name: dukaan-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
